[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mijia-ac-skill"
version = "0.1.0"
description = "Explicit, verified Xiaomi Home AC temperature control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "yyyzl"}]
dependencies = ["mi-home-cli==0.1.3"]

[project.scripts]
mijia-ac = "mijia_ac.cli:main"

[tool.uv.sources]
mi-home-cli = { path = "vendor/mi-home-cli" }

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/mijia_ac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
