# 无真实设备数据的示例；复制到仓库外后按自己的设备 spec 修改。
device_id = "REPLACE_WITH_DEVICE_ID"
profile = "ac_control"
# 相对于私有配置文件所在目录；与 README 授权步骤的 MI_HOME_CONFIG_DIR 一致。
state_dir = "../mijia-ac-state"
channel = "cloud"
timeout = 20
# 16/30/1 仅为虚构示例；必须按设备 spec 核对，不能直接沿用。
min_temperature = 16
max_temperature = 30
temperature_step = 1
on_property = "air-conditioner.on"
temperature_property = "air-conditioner.target-temperature"
mode_property = "air-conditioner.mode"
# 只有使用模式切换时才添加 mode_cool / mode_heat，值须来自该设备 spec。

# set-temp / mode 实际写入须 --apply；关机时额外 --allow-power-on。
